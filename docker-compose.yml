services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opencai
      POSTGRES_PASSWORD: opencai
      POSTGRES_DB: opencai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencai -d opencai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [opencai]

  minio:
    # MinIO no longer publishes `minio/minio` (or `minio/mc`) on Docker Hub;
    # Chainguard's image is a current build of the same server and takes the
    # same command and environment variables.
    image: cgr.dev/chainguard/minio:latest
    environment:
      MINIO_ROOT_USER: opencai
      MINIO_ROOT_PASSWORD: opencai12345
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # The image doesn't ship curl, so a curl-based healthcheck can never
    # pass; `mc` is bundled in the image and is MinIO's own documented
    # healthcheck form.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Publishes the S3 API (9000) and console (9001) ports to the host, per
    # PLAN.md's description of this service. Previously kept internal-only by
    # mistake, which also left S3_PUBLIC_URL-issued browser URLs unreachable.
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [opencai]

  # One-shot: creates the S3_BUCKET bucket on first run, then exits. Compose's
  # default restart policy ("no") means it never restarts once it has
  # completed, so this only ever runs its two `mc` commands once per volume
  # lifetime (`mc mb --ignore-existing` also makes a second run harmless).
  # Reuses the server image because it bundles both `mc` and a shell
  # (Chainguard's separate minio-client image has no shell).
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 opencai opencai12345 &&
      mc mb --ignore-existing local/opencai &&
      mc anonymous set download local/opencai
      "
    networks: [opencai]

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      # Overrides backend/.env's host-networking values (localhost) with the
      # compose network's service hostnames. env_file: values are overridden
      # by environment: values of the same name, so backend/.env itself needs
      # no edits to work under both `dev.sh` and `docker compose up`.
      DATABASE_URL: postgresql://opencai:opencai@postgres:5432/opencai?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: opencai
      S3_SECRET_KEY: opencai12345
      S3_BUCKET: opencai
      # Browser-facing URL for uploaded branding assets -- minio:9000 is only
      # resolvable on the compose network, not from a browser on the host.
      S3_PUBLIC_URL: http://localhost:9000
      # Frontend (nginx, :8080) and backend (:4000) are different origins
      # under compose; without this, NODE_ENV=production below makes CORS
      # reject every browser request from the frontend.
      CORS_ORIGIN: http://localhost:8080
      NODE_ENV: production
      # Pins the in-container listen port to match the "4000:4000" mapping
      # below regardless of backend/.env's own PORT (which still governs
      # dev.sh).
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      # "Docker outside of Docker": the AI agent orchestrator (backend/src/ai/
      # sandbox/sandboxManager.js) provisions per-chat-session sandbox
      # containers via dockerode. Mounting the host's socket lets it create
      # those as sibling containers on the host Docker daemon. This grants the
      # backend container effective host-level Docker control -- a real
      # operational trade-off, not hidden here. The sandbox image itself
      # (opencai-sandbox:2.15.30, see backend/sandbox/README.md) must still be
      # built on the host separately; it is not built by this compose file.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4000:4000"
    networks: [opencai]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [backend]
    restart: unless-stopped
    networks: [opencai]

networks:
  opencai:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
