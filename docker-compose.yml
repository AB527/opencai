services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opencai
      POSTGRES_PASSWORD: opencai
      POSTGRES_DB: opencai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencai -d opencai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [opencai]

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: opencai
      MINIO_ROOT_PASSWORD: opencai12345
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [opencai]

  # One-shot: creates the S3_BUCKET bucket on first run, then exits. Compose's
  # default restart policy ("no") means it never restarts once it has
  # completed, so this only ever runs its two `mc` commands once per volume
  # lifetime (`mc mb --ignore-existing` also makes a second run harmless).
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 opencai opencai12345 &&
      mc mb --ignore-existing local/opencai
      "
    networks: [opencai]

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      # Overrides backend/.env's host-networking values (localhost) with the
      # compose network's service hostnames. env_file: values are overridden
      # by environment: values of the same name, so backend/.env itself needs
      # no edits to work under both `dev.sh` and `docker compose up`.
      DATABASE_URL: postgresql://opencai:opencai@postgres:5432/opencai?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: opencai
      S3_SECRET_KEY: opencai12345
      S3_BUCKET: opencai
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      # "Docker outside of Docker": the AI agent orchestrator (backend/src/ai/
      # sandbox/sandboxManager.js) provisions per-chat-session sandbox
      # containers via dockerode. Mounting the host's socket lets it create
      # those as sibling containers on the host Docker daemon. This grants the
      # backend container effective host-level Docker control -- a real
      # operational trade-off, not hidden here. The sandbox image itself
      # (opencai-sandbox:2.15.30, see backend/sandbox/README.md) must still be
      # built on the host separately; it is not built by this compose file.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4000:4000"
    networks: [opencai]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [backend]
    networks: [opencai]

networks:
  opencai:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
