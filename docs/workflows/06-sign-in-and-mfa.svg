<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1200" viewBox="0 0 1120 1200">
<title>Signing in</title>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#1f1f1f" stroke-width="1.3"/></marker>
  <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#7a2e2e" stroke-width="1.3"/></marker>
</defs>
<rect width="1120" height="1200" fill="#fbfaf7"/>
<text x="48" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1f1f1f">Signing in</text>
<text x="48" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#5e5e5e">Password first, then a one-time code. The session token is only issued after both.</text>
<line x1="48" y1="102" x2="1072" y2="102" stroke="#a3a09a" stroke-width="0.8"/>
<line x1="48" y1="1156" x2="1072" y2="1156" stroke="#a3a09a" stroke-width="0.8"/>
<text x="48" y="1178" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#5e5e5e">Fig. 6 — source: backend/src/modules/auth/auth.service.js</text>
<text x="1072" y="1178" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#5e5e5e">OPENCAI · WORKFLOWS</text>
<rect x="300" y="124" width="360" height="44" rx="22" fill="#f1eee8" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="151" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Open the sign-in page</text>
<rect x="300" y="204" width="360" height="62" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="232" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Username and password</text>
<text x="480" y="248.25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="400" fill="#1f1f1f">POST /api/auth/login</text>
<path d="M480,168 L480,204" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<polygon points="480,301 600,344 480,387 360,344" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="340" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">Credentials</text>
<text x="480" y="356" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">valid?</text>
<path d="M480,266 L480,301" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<rect x="760" y="314" width="300" height="60" rx="3" fill="#ffffff" stroke="#7a2e2e" stroke-width="1.5"/>
<text x="910" y="349" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Invalid username or password</text>
<path d="M600,344 L760,344" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="690" y="336" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<rect x="300" y="434" width="360" height="62" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="462" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Short-lived MFA token</text>
<text x="480" y="478.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">valid for 10 minutes; proves step one only</text>
<path d="M480,387 L480,434" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="490" y="416" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<polygon points="480,531 600,574 480,617 360,574" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="570" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">MFA</text>
<text x="480" y="586" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">enrolled?</text>
<path d="M480,496 L480,531" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<rect x="760" y="544" width="300" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="910" y="571" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Enrol an authenticator</text>
<text x="910" y="587.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">scan a QR code (otpauth://)</text>
<rect x="760" y="644" width="300" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="910" y="671" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Confirm a 6-digit code</text>
<text x="910" y="687.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">10 backup codes shown once</text>
<path d="M600,574 L760,574" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="690" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<path d="M910,604 L910,644" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<polygon points="480,671 600,714 480,757 360,714" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="710" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">Authenticator</text>
<text x="480" y="726" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">code valid?</text>
<path d="M480,617 L480,671" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="490" y="648" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<polygon points="145,814 240,854 145,894 50,854" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="145" y="850" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">One-time backup</text>
<text x="145" y="866" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">code matches?</text>
<path d="M360,714 L145,714 L145,814" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="240" y="706" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<rect x="55" y="960" width="180" height="50" rx="3" fill="#ffffff" stroke="#7a2e2e" stroke-width="1.5"/>
<text x="145" y="990" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Invalid code</text>
<path d="M145,894 L145,960" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="155" y="944" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<rect x="300" y="824" width="360" height="62" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="852" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Session token issued</text>
<text x="480" y="868.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">role in the token · expires after 12 hours</text>
<path d="M480,757 L480,824" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="490" y="790" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<path d="M240,854 L300,855" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="270" y="846" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<path d="M910,704 L910,855 L660,855" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<rect x="300" y="924" width="360" height="50" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="480" y="954" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Kept in the browser, sent as a Bearer token</text>
<path d="M480,886 L480,924" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<rect x="290" y="1060" width="170" height="44" rx="22" fill="#f1eee8" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="375" y="1087" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Admin console</text>
<rect x="500" y="1060" width="170" height="44" rx="22" fill="#f1eee8" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="585" y="1087" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Operator console</text>
<path d="M450,974 L450,1024 L375,1024 L375,1060" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="365" y="1016" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">ADMIN</text>
<path d="M510,974 L510,1024 L585,1024 L585,1060" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="595" y="1016" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">OPERATOR</text>
</svg>
