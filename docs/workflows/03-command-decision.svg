<text x="690" y="1280.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">[&quot;all&quot;] = enabled regions · at most 25 · one result</text>
