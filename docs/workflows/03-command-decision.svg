<text x="280" y="1280.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">timeout · non-root · output sanitised</text>
<rect x="500" y="1236" width="380" height="62" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
