<path d="M595,1146 L690,1146 L690,1236" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="700" y="1138" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<path d="M840,1236 L840,1188 L950,1188 L950,946" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="960" y="1080" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">invalid regions request</text>
