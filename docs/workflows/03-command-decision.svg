<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1480" viewBox="0 0 1180 1480">
<title>How a proposed command is decided</title>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#1f1f1f" stroke-width="1.3"/></marker>
  <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#7a2e2e" stroke-width="1.3"/></marker>
</defs>
<rect width="1180" height="1480" fill="#fbfaf7"/>
<text x="48" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1f1f1f">How a proposed command is decided</text>
<text x="48" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#5e5e5e">Every command the model proposes passes these checks, in order. Nothing unrecognised runs.</text>
<line x1="48" y1="102" x2="1132" y2="102" stroke="#a3a09a" stroke-width="0.8"/>
<line x1="48" y1="1436" x2="1132" y2="1436" stroke="#a3a09a" stroke-width="0.8"/>
<text x="48" y="1458" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#5e5e5e">Fig. 3 — source: backend/src/ai/policy/commandPolicy.js, backend/src/ai/orchestrator.js</text>
<text x="1132" y="1458" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#5e5e5e">OPENCAI · WORKFLOWS</text>
<rect x="290" y="122" width="360" height="56" rx="28" fill="#f1eee8" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="147" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">The model proposes a command</text>
<text x="470" y="163.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">tool call: command · explanation · optional regions</text>
<rect x="290" y="214" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="241" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">1  Parse into arguments</text>
<text x="470" y="257.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">shell-quote tokenizer</text>
<rect x="290" y="310" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="337" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">2  Shell operators?</text>
<text x="470" y="353.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">&amp;&amp;   ||   |   ;   &gt;   &lt;   globs</text>
<rect x="290" y="406" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="433" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">3  Backticks or $( ) ?</text>
<text x="470" y="449.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">never valid in an AWS argument</text>
<rect x="290" y="502" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="529" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">4  Binary on the allowlist?</text>
<text x="470" y="545.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">the persona’s allowed binaries — aws</text>
<rect x="290" y="598" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="625" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">5  Documentation request?</text>
<text x="470" y="641.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">--help, or  aws … help</text>
<rect x="290" y="694" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="721" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">6  aws &lt;service&gt; &lt;operation&gt; ?</text>
<text x="470" y="737.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">structure check</text>
<rect x="290" y="790" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="817" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">7  Changes resources?</text>
<text x="470" y="833.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">create-  delete-  stop-  start-  modify-  run-instances …</text>
<rect x="290" y="886" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="913" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">8  Read-only operation?</text>
<text x="470" y="929.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">describe-   list-   get-</text>
