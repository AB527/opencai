<path d="M650,340 L790,340" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="720" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">present</text>
<path d="M650,436 L790,436" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="720" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">present</text>
<path d="M650,532 L790,532" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="720" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">not listed</text>
<path d="M650,724 L790,724" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="720" y="716" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">missing</text>
<path d="M650,916 L790,916" fill="none" stroke="#7a2e2e" stroke-width="1.1" marker-end="url(#head-accent)"/>
<text x="720" y="908" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#7a2e2e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">default deny</text>
<rect x="40" y="598" width="190" height="60" rx="3" fill="#f1eee8" stroke="#1f1f1f" stroke-width="1.5"/>
<text x="135" y="625" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Lookup</text>
<text x="135" y="641.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">documentation · runs now</text>
<path d="M290,628 L230,628" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="260" y="620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<rect x="40" y="790" width="190" height="60" rx="3" fill="#f1eee8" stroke="#1f1f1f" stroke-width="1.5"/>
<text x="135" y="817" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Needs confirmation</text>
<text x="135" y="833.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">the Operator decides — Fig. 4</text>
<path d="M290,820 L230,820" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="260" y="812" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<rect x="290" y="1010" width="360" height="60" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="1037" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f1f1f">Runs now, no human in the loop</text>
<text x="470" y="1053.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">lookups and read-only commands</text>
<path d="M470,946 L470,1010" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="990" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<path d="M40,628 L22,628 L22,1040 L290,1040" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<polygon points="470,1104 595,1146 470,1188 345,1146" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
<text x="470" y="1142" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">regions</text>
<text x="470" y="1158" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">requested?</text>
<path d="M470,1070 L470,1104" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<rect x="120" y="1236" width="320" height="62" rx="3" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.1"/>
