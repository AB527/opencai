<path d="M470,274 L470,310" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="296" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">parsed</text>
<path d="M470,370 L470,406" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="392" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<path d="M470,466 L470,502" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="488" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<path d="M470,562 L470,598" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="584" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<path d="M470,658 L470,694" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="680" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<path d="M470,754 L470,790" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="776" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">yes</text>
<path d="M470,850 L470,886" fill="none" stroke="#1f1f1f" stroke-width="1.1" marker-end="url(#head)"/>
<text x="480" y="872" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#5e5e5e" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">no</text>
<rect x="790" y="214" width="320" height="732" rx="3" fill="#ffffff" stroke="#7a2e2e" stroke-width="1.5"/>
<text x="950" y="537" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7a2e2e">Rejected</text>
<text x="950" y="553.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">never runs</text>
<text x="950" y="569.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e"></text>
<text x="950" y="585.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">the reason goes back to the model,</text>
<text x="950" y="601.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">which tries an allowed way instead</text>
<text x="950" y="617.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e"></text>
<text x="950" y="633.5" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e5e5e">audit: command rejected</text>
